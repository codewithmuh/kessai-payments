name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-checks:
    name: Repo checks (workflows, secrets, misconfigurations)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets in older commits are found too
          persist-credentials: false
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    defaults:
      run:
        working-directory: services/api
    services:
      # Aurora PostgreSQL 17 in AWS. Tests marked `postgres` (row locks, SKIP LOCKED) need it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kessai
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kessai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kessai -d kessai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://kessai:ci-only@localhost:5432/kessai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
      - run: uv run python manage.py makemigrations --check --dry-run # models and migrations agree
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
      - run: uv run pytest # fails below 80% coverage (see pyproject.toml)

  images:
    name: Image ${{ matrix.service }} (build, scan, smoke test)
    needs: [python]
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            port: 8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (container starts, serves traffic, shuts down gracefully)
        env:
          IMAGE: ${{ matrix.service }}:ci
          PORT: ${{ matrix.port }}
        run: |
          # No database here: /readyz would rightly say 503, so check liveness and a DB-free route.
          docker run --detach --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --env DJANGO_SECRET_KEY=ci-only-smoke-test-secret-key-0123456789 \
            --env DATABASE_URL=postgres://nobody:nothing@127.0.0.1:1/none \
            --publish "127.0.0.1:9000:${PORT}" "$IMAGE"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9000/healthz
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:9000/v1/openapi.yaml
          docker stop --time 20 smoke # graceful shutdown must finish in time
          docker logs smoke | tail -n 5
