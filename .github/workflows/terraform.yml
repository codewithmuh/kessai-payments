name: terraform

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # an explicit shell adds -o pipefail, so a failing command in a pipe fails the step

env:
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs before `terraform init`, so the registry modules downloaded into .terraform/ are not
      # scanned as if they were our code. Exceptions and their reasons: infra/.checkov.yaml.
      - name: Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: infra
          config_file: infra/.checkov.yaml
          output_format: cli
          quiet: true
          compact: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate (no backend, no AWS credentials)
        run: |
          for stack in bootstrap platform data fis backup-plan backup-account; do
            terraform -chdir="infra/${stack}" init -backend=false
            terraform -chdir="infra/${stack}" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: TFLint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset from GitHub releases
        run: |
          tflint --init
          tflint --recursive --config "${PWD}/.tflint.hcl" --format compact
