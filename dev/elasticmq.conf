# ElasticMQ: a local, SQS-compatible queue server (compose.yaml → sqs, http://localhost:9324).
# The same queues as AWS: a FIFO queue for webhook events and its dead-letter queue.
include classpath("application.conf")

queues {
  "webhook-events-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "webhook-events.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "webhook-events-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}
